# Default values for nginx chart
nameOverride: ""
fullnameOverride: ""

namespaceOverride: ""

# Labels applied to all resources (wired from values.yaml.tmpl by broker)
commonLabels:
  app: nginx
  service-type: nginx

# Annotations applied to all resources (wired from values.yaml.tmpl by broker)
commonAnnotations: {}

# Broker instance metadata (wired from values.yaml.tmpl)
instance:
  name: ""
  id: ""
  environment: ""
  clusterName: ""

# Image — split registry + repository so service-render can substitute BYOP_REGISTRY
image:
  registry: "docker.io"
  repository: "library/nginx"
  tag: ""           # empty = falls back to Chart.appVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: false
  annotations: {}
  name: ""

# Pod-level security context — OpenShift restricted-v2 compatible
# fsGroup: null lets OpenShift assign the GID via SCC
podSecurityContext:
  fsGroup: null
  seccompProfile:
    type: RuntimeDefault

# Container-level security context
# readOnlyRootFilesystem: false — nginx writes PID files and tmp dirs
securityContext:
  allowPrivilegeEscalation: false
  privileged: false
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: null
  runAsGroup: null
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

service:
  type: ClusterIP
  port: 80

deployment:
  replicas: 1

# Text rendered into /usr/share/nginx/html/index.html via ConfigMap
welcomeMessage: "Welcome"

resources: {}

probes:
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
  liveness:
    initialDelaySeconds: 10
    periodSeconds: 15
    timeoutSeconds: 3

# Made with IBM Bob
