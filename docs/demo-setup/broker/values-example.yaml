# CL12 Cluster Configuration
# Override values for cl11 (catalog.example.com)

global:
  imageRegistry: registry.example.com
  imageOrganization: byop

cluster:
  domain: cluster.example.com

broker:
  image:
    tag: "1.5.5-01"

  auth:
    enabled: false  # Disabled for development - catalog app doesn't have JWT auth
    verifySSL: false  # Set true in production with valid certs

  gitops:
    repoUrl: ssh://1000990000@192.168.2.27:30022/gitops/gitops.git

  # optional
  dashboardUrlTemplate: "https://argocd.example.com/applications/argocd/{instance_id}?view=tree"

  # Default cluster configuration (hub cluster where broker runs)
  clusters:
    - server: "https://kubernetes.default.svc"
      name: "in-cluster"
      type: "hub"
      default: true

  secrets:
    # Note: preserve consistent indentation when adding the private key text
    sshPrivateKey: |
      -----BEGIN OPENSSH PRIVATE KEY-----
      from ~/.ssh/giteaxxx key
      -----END OPENSSH PRIVATE KEY-----

catalogApp:
  enabled: true  # Set false if not using the test UI
  image:
    tag: "1.0.4-01"

