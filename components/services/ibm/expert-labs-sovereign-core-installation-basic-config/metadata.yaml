apiVersion: sovereign-catalog.io/v1alpha1
kind: ServiceProfile
metadata:
  companyRef: "companies/ibm"
  name: "IBM Expert Labs - IBM Sovereign Core Installation and Basic Configuration"
  shortDescription: "Establish a sovereign-by-design foundation for compliant, scalable, and AI-ready operations."
  fullDescription: "IBM Expert Labs deploys and configures the IBM Sovereign Core platform, enabling organizations to operationalize the roadmap defined during the assessment phase. Working with your technical and business stakeholders, we install and configure the core platform services, establish governance and operational controls, and align the environment with applicable regulatory and sovereignty requirements. The engagement focuses on creating a production-ready foundation that supports data, operational, technology, and AI sovereignty while enabling future growth and service expansion. The engagement delivers a configured Sovereign Core environment, including Compliance Center setup aligned with governing laws and regulations, implementation of the data and AI sovereignty controls identified during the assessment, and foundational operational capabilities for ongoing governance and compliance. By the conclusion of the engagement, organizations have a functioning sovereign platform, a baseline compliance posture, and an architecture designed to scale additional workloads, services, and AI capabilities while maintaining control, visibility, and regulatory alignment. This provides a practical starting point for operationalizing sovereign services, governed AI, continuous compliance monitoring, and future adoption of additional Sovereign Core capabilities."
  sovereignCoreRelevance: "Delivers the hands-on installation and configuration of IBM Sovereign Core, establishing a production-ready sovereign platform with Compliance Center, data and AI sovereignty controls, and a governance foundation for continuous compliance and future service expansion."
  industries: ["government", "bfsi", "healthcare", "energy", "telco"]
  intendedUsers: ["Platform teams", "Infrastructure teams", "Technology stakeholders", "Compliance officers", "Enterprise architects"]
  lifecycleStatus: "approved"
  storefrontVisibility: "public"
  availabilityState: "available_central_it"
