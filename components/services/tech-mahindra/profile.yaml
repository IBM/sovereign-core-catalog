apiVersion: sovereign-catalog.io/v1alpha1
kind: ServiceProfile
metadata:
  companyRef: "companies/tech-mahindra"
  name: "Tech Mahindra Orion + DSLM Sovereign Services"
  shortDescription: "End-to-end managed sovereign AI, system integration, and data lifecycle services. Combines 24/7 NOC, on-premises LLMOps, staff-cleared operations, and automated compliance reporting — enabling regulated governments and enterprises to run critical AI infrastructure entirely within their sovereign boundary."
  fullDescription: "Tech Mahindra Orion + DSLM Sovereign Services is a comprehensive managed-services offering purpose-built for regulated organisations that must operate AI platforms, data pipelines, and digital infrastructure inside sovereign boundaries, spanning managed operations, system integration, audit and compliance, and AI lifecycle management under a single contractual framework. Capabilities: 24/7 NOC with a 4-hour critical-incident SLA, dedicated Technical Account Management, on-premises LLM fine-tuning and inferencing, sovereign data pipeline management, and automated BSI-C5 and ISO-27001 compliance evidence generation via the DSLM audit trail. Deployment: supports air-gapped and private-connectivity datacentres across Amsterdam, Frankfurt, Mumbai, and Hyderabad with dedicated private connectivity and no shared internet uplinks for sovereign zones. Security and compliance: ISO-27001 (Active), SOC 2 (Active), BSI-C5 (In Progress); EU-national staff available for EU sovereign contracts; GDPR DPO certified; India IT Act compliant; remote access not required for day-to-day operations. Integrations: IBM watsonx, PyTorch, TensorFlow, LangChain, and customer-defined data pipelines; plugs into existing ITSM and SIEM tooling via standard APIs. Use cases: sovereign AI platform operations for national-government agencies, regulated-industry digital transformation, staff-cleared managed security operations, and cross-jurisdictional data lifecycle governance. Business benefits: removes the operational burden of sovereign AI infrastructure, accelerates compliance certification through automated evidence packs, and provides a fully auditable human-operations layer keeping all control, data, and audit trails inside the sovereign perimeter."
  sovereignCoreRelevance: "Provides the human and operational layer for sovereign deployments — delivering staff-cleared managed operations, on-premises LLMOps, and automated compliance evidence packs that keep control, data, and audit trails within the sovereign boundary."
  industries: ["government", "bfsi", "healthcare", "energy", "telco"]
  intendedUsers: ["Platform teams", "Compliance officers", "Infrastructure teams", "IT operations"]
  lifecycleStatus: "approved"
  storefrontVisibility: "public"
  availabilityState: "available_central_it"
spec:
  serviceType: "ManagedOperations"
  additionalServiceTypes:
    - "SystemIntegration"
    - "AuditAndCompliance"
  description: "Sovereign technology and services offering supporting controlled AI deployments, digital transformation, and data lifecycle management within regulated environments."
  sovereignty:
    corporateHQ: "India"
    ultimateParentCompanyHQ: "India"
    staffClearanceLevel: "EU-GDPR DPO certified; India IT Act compliant; EU-national staff available for EU sovereign contracts under TechM EU entity"
    remoteAccessRequired: false
  certifications:
    - framework: "ISO-27001"
      status: "Active"
    - framework: "SOC2"
      status: "Active"
    - framework: "BSI-C5"
      status: "In Progress"
  capabilities:
    hosting:
      providesBareMetal: false
      airGappedReady: true
      datacentreLocations: ["Amsterdam, Netherlands", "Frankfurt, Germany", "Mumbai, India", "Hyderabad, India"]
      networkIsolation: "Dedicated private connectivity; no shared internet uplinks for sovereign zones"
    managedOperations:
      sla: "99.95% uptime; 4-hour response SLA for critical incidents"
      supportTiers: ["24/7 NOC", "Dedicated TAM", "AI lifecycle management", "Data sovereignty compliance reporting"]
    aiPlatformServices:
      llmOpsManaged: true
      modelFinetuningOnPrem: true
      sovereignDataPipelineManagement: true
      supportedFrameworks: ["PyTorch", "TensorFlow", "LangChain", "IBM watsonx"]
      complianceReporting: "Automated BSI-C5 and ISO-27001 evidence packs; DSLM data lifecycle audit trails"
