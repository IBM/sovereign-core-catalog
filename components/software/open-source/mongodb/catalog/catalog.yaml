name: MongoDB Database
metadata:
  name: mongodb-helm-git
  namespace: byop-broker
spec:
  productId: mongodb-helm
  sourceType: helm-git
  repoURL: git@github.ibm.com:sovcore/sovcore-placeholder.git
  version: "1.0.0"
  catalogRegistration:
    displayName: MongoDB Database
    description: MongoDB document database service with broker-generated credentials stored in Git, deployed with Helm
    plans:
      - id: standard
        name: Standard
        description: Standard MongoDB standalone deployment from Helm
      - id: mongodbhelm_plan
        name: Default
        description: Default MongoDB standalone deployment from Helm
    category: databases
    tags: [Database, NoSQL, DocumentDB, MongoDB]
    supportUrl: https://www.ibm.com
    marketingUrl: https://www.ibm.com/products
    provisioningDurationMinutes: 10
