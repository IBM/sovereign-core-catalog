{{- $instanceName := default .Release.Name .Values.instance.name -}}
{{- $secretName := printf "mariadb-%s" $instanceName -}}
{{- $namespace := default .Release.Namespace .Values.namespaceOverride -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ $namespace }}
  labels:
    app: {{ .Values.commonLabels.app | quote }}
    service-type: {{ index .Values.commonLabels "service-type" | quote }}
    instance: {{ $instanceName | quote }}
    managed-by: byop-broker
    {{- range $key, $value := .Values.commonLabels }}
    {{- if and (ne $key "app") (ne $key "service-type") }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
    {{- end }}
  annotations:
    byop.ibm.com/instance-id: {{ .Values.instance.id | quote }}
    byop.ibm.com/service-type: "mariadb"
    byop.ibm.com/cluster: {{ .Values.instance.clusterName | quote }}
    {{- with .Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
type: Opaque
stringData:
  root-password: {{ .Values.auth.rootPassword | quote }}
  user: {{ .Values.auth.username | quote }}
  password: {{ .Values.auth.password | quote }}
  database: {{ .Values.auth.database | quote }}
  {{- with index .Values.databaseConfig "character-set" }}
  character-set: {{ . | quote }}
  {{- end }}
  {{- with index .Values.databaseConfig "collation" }}
  collation: {{ . | quote }}
  {{- end }}
  connection-string: {{ printf "mariadb://%s:%s@mariadb-%s:3306/%s" .Values.auth.username .Values.auth.password $instanceName .Values.auth.database | quote }}
  jdbc-url: {{ printf "jdbc:mariadb://mariadb-%s:3306/%s?characterEncoding=%s" $instanceName .Values.auth.database (default "" (index .Values.databaseConfig "character-set")) | quote }}

