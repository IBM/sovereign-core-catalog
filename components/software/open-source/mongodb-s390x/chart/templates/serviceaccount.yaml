{{- /*
  serviceaccount.yaml — COMPLIANCE Phase 1

  ── Controls implemented ────────────────────────────────────────────────────
  mdb-rbac-03 → iscf-ia-01
    Dedicated ServiceAccount + Role + RoleBinding for the MongoDB VM workload.
    Grants the virt-launcher pod the minimum OCP RBAC surface needed at runtime:
      get/list on: pods, configmaps, secrets (read-only, within namespace only).
    Satisfies: "OCP ServiceAccount with minimal RBAC for MongoDB VM".

  ── Render conditions ────────────────────────────────────────────────────────
  Only rendered when serviceAccount.enabled=true (default: true).
  Opt-out: set serviceAccount.enabled=false if the namespace already provides
           a dedicated SA with equivalent minimal permissions.

  ── Relationship to ArgoCD SA ────────────────────────────────────────────────
  This SA is separate from the ArgoCD admin RoleBinding in argocd-rbac.yaml.
  The ArgoCD SA (argocd-application-controller) manages GitOps resources;
  this SA is used by the virt-launcher pod that runs the MongoDB VM workload.

  ── Controls NOT covered here (external tooling required) ────────────────────
  mdb-rbac-01  least-privilege MongoDB DB roles  → RHACS DB user scan
  mdb-rbac-02  no root role in production        → RHACS role scan
  mdb-rbac-04  VM RBAC approved users only       → Compliance Operator
*/ -}}
{{- if include "mongodb-vm.val" (list . "serviceAccount.enabled") | eq "true" }}
---
## COMPLIANCE Phase 1 — mdb-rbac-03 (iscf-ia-01)
## Dedicated ServiceAccount for the MongoDB VM workload.
## Principle of least privilege: no cluster-wide permissions.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "mongodb-vm.fullname" . }}
  namespace: {{ .Values.namespaceOverride | default .Release.Namespace }}
  labels:
    {{- include "mongodb-vm.labels" . | nindent 4 }}
    ## COMPLIANCE Phase 1 — mdb-rbac-03 (iscf-ia-01)
  annotations:
    {{- include "mongodb-vm.annotations" . | nindent 4 }}
    compliance.sovcore.ibm.com/controls: "mdb-rbac-03"
    compliance.sovcore.ibm.com/iscf: "iscf-ia-01"
    compliance.sovcore.ibm.com/phase: "1"
---
## COMPLIANCE Phase 1 — mdb-rbac-03 (iscf-ia-01)
## Minimal Role: read-only access to pods, configmaps, secrets within namespace.
## Intentionally NOT granted: create/delete/patch on any resource.
## Intentionally NOT granted: access to any cluster-scoped resources.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "mongodb-vm.fullname" . }}
  namespace: {{ .Values.namespaceOverride | default .Release.Namespace }}
  labels:
    {{- include "mongodb-vm.labels" . | nindent 4 }}
  annotations:
    {{- include "mongodb-vm.annotations" . | nindent 4 }}
    compliance.sovcore.ibm.com/controls: "mdb-rbac-03"
    compliance.sovcore.ibm.com/iscf: "iscf-ia-01"
    compliance.sovcore.ibm.com/phase: "1"
rules:
  ## Read-only access to pods — allows the VM workload to query peer pod status.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  ## Read-only access to configmaps — allows the VM to read injected configuration.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
  ## Read-only access to secrets — allows the VM to read injected credentials.
  ## NOTE: Secrets should be mounted as env vars or volumes, not read via API.
  ##       This rule satisfies the control without granting write access.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
---
## COMPLIANCE Phase 1 — mdb-rbac-03 (iscf-ia-01)
## Binds the minimal Role to the dedicated ServiceAccount.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "mongodb-vm.fullname" . }}
  namespace: {{ .Values.namespaceOverride | default .Release.Namespace }}
  labels:
    {{- include "mongodb-vm.labels" . | nindent 4 }}
  annotations:
    {{- include "mongodb-vm.annotations" . | nindent 4 }}
    compliance.sovcore.ibm.com/controls: "mdb-rbac-03"
    compliance.sovcore.ibm.com/iscf: "iscf-ia-01"
    compliance.sovcore.ibm.com/phase: "1"
subjects:
  - kind: ServiceAccount
    name: {{ include "mongodb-vm.fullname" . }}
    namespace: {{ .Values.namespaceOverride | default .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "mongodb-vm.fullname" . }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
