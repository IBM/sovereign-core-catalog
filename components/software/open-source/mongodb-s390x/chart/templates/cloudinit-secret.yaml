{{/*
cloudinit-secret.yaml

Renders the full cloud-init userdata (including passwords) into a Kubernetes Secret
instead of embedding it inline in the VirtualMachine manifest.

KubeVirt cloudInitNoCloud.userDataSecretRef reads the "userdata" key from this
Secret and passes it to the VM as the cloud-init data source at boot time.

The VirtualMachine manifest therefore contains NO passwords — only a reference to
this Secret name. Passwords exist only in etcd, never in git or ArgoCD manifests.

Secret naming:
  Standalone : <name>-cloudinit
  HA member i: <name>-cloudinit-<i>

The Secret is annotated with helm.sh/resource-policy: keep so it survives
helm uninstall (the VM may still need it on next boot after manual restart).
*/}}

{{- $root := . -}}
{{- $base := include "mongodb-vm.fullname" . -}}
{{- $ns   := .Values.namespaceOverride | default .Release.Namespace -}}
{{- /*
  Passwords are resolved ONCE per render, in THIS file, and used for BOTH the
  cloud-init userdata and the <name>-mongodb-creds Secret below. They used to be
  resolved separately in credentials-secret.yaml (now removed): with Helm `lookup`
  disabled (ArgoCD) every resolvePasswords call returns different randAlphaNum
  values, so the creds Secret never matched the passwords actually set on the VMs.
*/ -}}
{{- $credPasswords := include "mongodb-vm.resolvePasswords" . | fromJson -}}

{{- /*
  Vault PKI TLS bootstrap (Phase 3, mdb-enc-01) — resolved ONCE per render
  here, next to the passwords, for the same ArgoCD-determinism reason: the
  helper performs NO Helm lookup, hard-fails when compliance.tls.enabled is
  true and any required value is missing, and validates that the single-use
  wrapped tokens and renewal secret-ids are ONE PER VM. Passed into both
  userdata contexts below as "vaultBootstrap".
*/ -}}
{{- $vaultBootstrap := include "mongodb-vm.vaultBootstrap" . | fromJson -}}

{{- if include "mongodb-vm.val" (list . "ha.enabled") | eq "true" -}}
{{- /*
  HA mode — one cloud-init Secret per replica set member.
  Each member has different: index, selfHost, memberList, RS flags.
  keyFile is generated once outside the loop (same pattern as virtualmachine.yaml).
*/ -}}
{{- $keyFileSecretName := printf "%s-keyfile" $base -}}
{{- $existingKeySecret := lookup "v1" "Secret" $ns $keyFileSecretName -}}
{{- $sharedKeyFile := "" -}}
{{- if .Values.mongodb.keyFile -}}
  {{- $sharedKeyFile = .Values.mongodb.keyFile -}}
{{- else if $existingKeySecret -}}
  {{- $sharedKeyFile = index $existingKeySecret.data "keyfile" | b64dec -}}
{{- else -}}
  {{- $sharedKeyFile = randAlphaNum 1024 -}}
{{- end -}}
{{- /* Resolve passwords ONCE before the loop — same fix as virtualmachine.yaml.
       ArgoCD disables lookup so randAlphaNum is called; must be outside the loop
       or each member gets a different ADMIN_PASS, breaking RS authentication. */ -}}
{{- $sharedPasswords := $credPasswords -}}
{{- range $i := until (include "mongodb-vm.val" (list . "ha.replicaCount") | default "3" | int) }}
{{- $ctx := dict "Values" $root.Values "Chart" $root.Chart "Release" $root.Release "index" $i "sharedKeyFile" $sharedKeyFile "sharedPasswords" $sharedPasswords "vaultBootstrap" $vaultBootstrap }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $base }}-cloudinit-{{ $i }}
  namespace: {{ $ns }}
  labels:
    {{- include "mongodb-vm.labels" $root | nindent 4 }}
    mongodb-vm/member-index: {{ $i | quote }}
  annotations:
    {{- include "mongodb-vm.annotations" $root | nindent 4 }}
    argocd.argoproj.io/sync-wave: "-1"
    sovcore.byop.ibm.com/secret-type: mongodb-cloudinit
    sovcore.byop.ibm.com/instance: {{ $base | quote }}
    sovcore.byop.ibm.com/member-index: {{ $i | quote }}
type: Opaque
data:
  ## KubeVirt reads the "userdata" key when cloudInitNoCloud.userDataSecretRef is set.
  userdata: {{ include "mongodb-vm.userdata.ha" $ctx | b64enc | quote }}
{{- end }}
{{- include "mongodb-vm.credsSecret" (dict "root" $root "p" $credPasswords) }}
{{- else }}
{{- /*
  Standalone mode — single cloud-init Secret.
*/ -}}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $base }}-cloudinit
  namespace: {{ $ns }}
  labels:
    {{- include "mongodb-vm.labels" . | nindent 4 }}
  annotations:
    {{- include "mongodb-vm.annotations" . | nindent 4 }}
    argocd.argoproj.io/sync-wave: "-1"
    sovcore.byop.ibm.com/secret-type: mongodb-cloudinit
    sovcore.byop.ibm.com/instance: {{ $base | quote }}
type: Opaque
data:
  userdata: {{ include "mongodb-vm.userdata" (dict "Values" .Values "Chart" .Chart "Release" .Release "sharedPasswords" $credPasswords "vaultBootstrap" $vaultBootstrap) | b64enc | quote }}
{{- include "mongodb-vm.credsSecret" (dict "root" $root "p" $credPasswords) }}
{{- end }}
