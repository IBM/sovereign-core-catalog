apiVersion: sovereign-catalog.io/v1alpha1
kind: SoftwareListing
metadata:
  companyRef: "companies/open-source"
  vendor: "Red Hat, Inc."
  product: "Keycloak"
  version: "26.6"
  lifecycleStatus: "approved"
  storefrontVisibility: "public"
spec:
  openSource:
    enabled: true
    license: "Apache-2.0"
    upstreamProject: "https://github.com/keycloak/keycloak"
    upstreamVersion: "26.6"
  architecture:
    format: "Kubernetes"
    airgapReady: true
    dependencyEndpoints: []
    storage:
      csiAccessModes: ["ReadWriteOnce"]
      volumeSnapshotSupport: true
  security:
    podSecurityStandard: "restricted"
    requiresClusterAdmin: false
    readOnlyRootFilesystem: true
    kmsIntegration: false
  deployment:
    type: "Helm"
    repository: "oci://registry-1.docker.io/bitnamicharts/keycloak"
