name: Langflow IDE
metadata:
  name: langflow-helm-git
  namespace: byop-broker
spec:
  productId: langflow-helm
  sourceType: helm-git
  repoURL: git@github.ibm.com:sovcore/sovcore-placeholder.git
  version: "1.0.0"
  catalogRegistration:
    displayName: Langflow IDE
    description: Full-lifecycle Langflow visual AI pipeline builder with broker-generated credentials stored in Git, deployed with Helm
    plans:
      - id: standard
        name: Standard
        description: Standard Langflow IDE deployment with persistent SQLite storage and auto-generated credentials
      - id: langflowhelm_plan
        name: Default
        description: Default Langflow IDE deployment with persistent SQLite storage and auto-generated credentials
    category: AITools
    tags: [AITools, LLM, PipelineBuilder, Langflow]
    supportUrl: https://www.ibm.com
    marketingUrl: https://www.ibm.com/products
    provisioningDurationMinutes: 10
