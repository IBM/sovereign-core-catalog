name: Rabbitmq Database
metadata:
  name: rabbitmq-helm-git
  namespace: byop-broker
spec:
  productId: rabbitmq-helm
  sourceType: helm-git
  repoURL: git@github.ibm.com:sovcore/sovcore-placeholder.git
  version: "1.0.0"
  catalogRegistration:
    displayName: Rabbitmq Database
    description: Full-lifecycle Rabbitmq database service with broker-generated credentials stored in Git, deployed with Helm
    plans:
      - id: standard
        name: Standard
        description: Standard Rabbitmq deployment with persistent storage and auto-generated credentials
      - id: rabbitmqhelm_plan
        name: Default
        description: Default Rabbitmq deployment with persistent storage and auto-generated credentials
    category: messaging
    tags: [Messaging, MessageBroker, AMQP, RabbitMQ]
    supportUrl: https://www.ibm.com
    marketingUrl: https://www.ibm.com/products
    provisioningDurationMinutes: 10
