apiVersion: sovereign-catalog.io/v1alpha1
kind: SoftwareListing
metadata:
  companyRef: "companies/open-source"
  vendor: "Broadcom Inc."
  product: "RabbitMQ"
  version: "4.3.2"
  lifecycleStatus: "approved"
  storefrontVisibility: "public"
spec:
  openSource:
    enabled: true
    license: "MPL-2.0"
    upstreamProject: "https://github.com/rabbitmq/rabbitmq-server"
    upstreamVersion: "4.3.2"
  architecture:
    format: "Kubernetes"
    airgapReady: true
    dependencyEndpoints: []
    storage:
      csiAccessModes: ["ReadWriteOnce"]
      volumeSnapshotSupport: true
  security:
    podSecurityStandard: "baseline"
    requiresClusterAdmin: false
    readOnlyRootFilesystem: false
    kmsIntegration: false
  deployment:
    type: "Helm"
    repository: "oci://registry-1.docker.io/bitnamicharts/rabbitmq"
