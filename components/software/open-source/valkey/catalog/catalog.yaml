name: Valkey Cache
metadata:
  name: valkey-helm-git
  namespace: byop-broker
spec:
  productId: valkey-helm
  sourceType: helm-git
  repoURL: git@github.ibm.com:sovcore/sovcore-placeholder.git
  version: "1.0.0"
  catalogRegistration:
    displayName: Valkey Cache
    description: Full-lifecycle Valkey cache service (Redis-compatible) with broker-generated credentials stored in Git, deployed with Helm
    plans:
      - id: standard
        name: Standard
        description: Standard Valkey deployment with persistent storage and auto-generated password
      - id: valkeyhelm_plan
        name: Default
        description: Default Valkey deployment with persistent storage and auto-generated password
    category: databases
    tags: [Database, NoSQL, KeyValueStore, Cache, Valkey]
    supportUrl: https://www.ibm.com
    marketingUrl: https://www.ibm.com/products
    provisioningDurationMinutes: 10
