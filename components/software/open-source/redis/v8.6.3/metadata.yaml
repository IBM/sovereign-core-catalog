apiVersion: sovereign-catalog.io/v1alpha1
kind: SoftwareListing
metadata:
  companyRef: "companies/open-source"
  vendor: "Redis Ltd."
  product: "Redis"
  version: "8.6.3"
  lifecycleStatus: "approved"
  storefrontVisibility: "public"
spec:
  openSource:
    enabled: true
    license: "RSALv2"
    upstreamProject: "https://github.com/redis/redis"
    upstreamVersion: "8.6.3"
  architecture:
    format: "Kubernetes"
    airgapReady: true
    dependencyEndpoints: []
    storage:
      csiAccessModes: ["ReadWriteOnce"]
      volumeSnapshotSupport: true
  security:
    podSecurityStandard: "baseline"
    requiresClusterAdmin: false
    readOnlyRootFilesystem: false
    kmsIntegration: false
  deployment:
    type: "Helm"
    repository: "oci://registry-1.docker.io/bitnamicharts/redis"
