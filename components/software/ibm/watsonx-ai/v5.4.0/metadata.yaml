apiVersion: sovereign-catalog.io/v1alpha1
kind: SoftwareListing
metadata:
  companyRef: "companies/ibm"
  vendor: "International Business Machines Corporation"
  product: "IBM watsonx.ai"
  version: "5.4.0"
  lifecycleStatus: "approved"
  storefrontVisibility: "public"
spec:
  openSource:
    enabled: false
    license: "IBM International Program License Agreement"
    sourceAvailable: false
  jurisdiction:
    hq: "USA"
    ultimateParentCompanyHQ: "USA"
  architecture:
    format: "Kubernetes"
    airgapReady: true
    dependencyEndpoints: []
    storage:
      csiAccessModes: ["ReadWriteOnce", "ReadWriteMany"]
      volumeSnapshotSupport: true
  security:
    podSecurityStandard: "baseline"
    requiresClusterAdmin: false
    readOnlyRootFilesystem: false
    kmsIntegration: false
  deployment:
    type: "Operator"
    repository: "oci://icr.io/cpopen/ibm-cpd-watsonx-ai-operator-catalog:v5.4.0"
