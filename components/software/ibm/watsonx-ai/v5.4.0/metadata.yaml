apiVersion: sovereign-catalog.io/v1alpha1
kind: SoftwareListing
metadata:
  companyRef: "companies/ibm"
  vendor: "International Business Machines Corporation"
  product: "IBM watsonx.ai"
  shortDescription: "IBM watsonx.ai is an integrated, end-to-end AI development studio that enables teams to build, test, customize, and scale enterprise AI — spanning foundation models, AI agents, RAG pipelines, and machine learning — all in one unified platform."
  fullDescription: "IBM watsonx.ai is a one-stop, enterprise-grade AI development studio designed to accelerate the journey from AI experimentation to production. It brings together foundation models, agent tooling, machine learning frameworks, APIs, and deployment runtimes in a single, integrated environment.Developers can build and deploy AI agents capable of reasoning through complex, multi-step workflows. The platform supports model customization — letting teams choose from thousands of state-of-the-art foundation models and fine-tune them with techniques suited to specific business use cases. RAG (Retrieval-Augmented Generation) development is also fully supported, enabling teams to ground AI outputs in trusted enterprise knowledge bases for greater accuracy and relevance. Key capabilities include prompt engineering, content generation, semantic search, text classification, conversational AI, and training and deploying predictive ML models. The studio integrates with popular developer tools and ecosystem partners for seamless adoption. Real-world results speak for its impact: clients report up to 85% reduction in unanswered customer service queries, 75% faster hiring processes, and 70% less time spent on legal document analysis — demonstrating measurable enterprise value across industries."
  sovereignCoreRelevance: "Supports controlled AI deployment patterns needed for sovereign, regulated, and disconnected environments."
  category: "ai"
  industries: ["bfsi", "government", "healthcare"]
  intendedUsers: ["Data scientists", "ML engineers", "Platform teams"]
  version: "5.4.0"
  lifecycleStatus: "approved"
  storefrontVisibility: "public"
  availabilityState: "available_central_it"
