apiVersion: sovereign-catalog.io/v1alpha1
kind: SoftwareListing
metadata:
  companyRef: "companies/ibm"
  vendor: "International Business Machines Corporation"
  product: "IBM QRadar SIEM"
  shortDescription: "IBM QRadar SIEM provides intelligent security analytics and comprehensive threat detection, prioritization, and response across hybrid cloud and sovereign environments."
  fullDescription: "IBM QRadar SIEM is an enterprise security information and event management solution that aggregates log events and network telemetry across distributed enterprise environments, correlates security data using advanced analytics, and surfaces high-fidelity offenses to security teams. Designed for regulated and sovereign deployments, it delivers real-time visibility, automated incident triage, customizable compliance dashboards, and out-of-the-box integration across hybrid cloud and air-gapped infrastructures."
  sovereignCoreRelevance: "Enables centralized security monitoring, localized event ingestion, and compliance auditing within sovereign security enclaves without requiring telemetry to leave national or organizational boundaries."
  category: "security"
  industries: ["government", "bfsi", "healthcare", "energy", "telco"]
  intendedUsers:
    ["SOC analysts", "Security engineers", "Incident responders", "Compliance officers"]
  version: "7.6.0"
  lifecycleStatus: "approved"
  storefrontVisibility: "public"
  availabilityState: "available_central_it"
spec:
  openSource:
    enabled: false
    license: "IBM International Program License Agreement"
    sourceAvailable: false
  jurisdiction:
    hq: "USA"
    ultimateParentCompanyHQ: "USA"
  architecture:
    format: "Kubernetes"
    airgapReady: true
    dependencyEndpoints: []
    storage:
      csiAccessModes: ["ReadWriteOnce", "ReadWriteMany"]
      volumeSnapshotSupport: true
  security:
    podSecurityStandard: "restricted"
    requiresClusterAdmin: false
    readOnlyRootFilesystem: true
    kmsIntegration: true
  deployment:
    type: "Helm"
    repository: "oci://icr.io/cpopen/charts/ibm-qradar:7.6.0"
  links:
    docsUrl: "https://www.ibm.com/docs/en/qsip/7.5"
    productPageUrl: "https://www.ibm.com/products/qradar-siem"