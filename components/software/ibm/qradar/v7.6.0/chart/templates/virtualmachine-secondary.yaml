{{- if eq .Values.topology "ha" -}}
{{- $sizing := include "qradar-ha.planSizing" . | fromYaml -}}
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  labels:
    {{- include "qradar-ha.labels" . | nindent 4 }}
    app.kubernetes.io/component: siem
    vm-role: secondary
  name: qradar-secondary
  namespace: {{ .Release.Namespace }}
spec:
  running: true
  dataVolumeTemplates:
  - apiVersion: cdi.kubevirt.io/v1beta1
    kind: DataVolume
    metadata:
      name: qradar-secondary-rootdisk
    spec:
      source:
        pvc:
          namespace: {{ .Values.storage.mediaNamespace }}
          name: {{ .Values.storage.goldenImagePvc }}
      storage:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ $sizing.storageGb }}Gi
        storageClassName: {{ .Values.storage.storageClassName }}
  - apiVersion: cdi.kubevirt.io/v1beta1
    kind: DataVolume
    metadata:
      name: qradar-secondary-installation-cdrom
    spec:
      source:
        pvc:
          namespace: {{ .Values.storage.mediaNamespace }}
          name: {{ .Values.storage.isoPvc }}
      storage:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.storage.isoStorageGb }}Gi
        storageClassName: {{ .Values.storage.storageClassName }}
  template:
    metadata:
      labels:
        kubevirt.io/domain: qradar-secondary
        app: qradar
        instance: {{ .Release.Name }}
        version: {{ .Chart.AppVersion | quote }}
        vm-role: secondary
    spec:
      domain:
        cpu:
          cores: {{ $sizing.cpuCores }}
          sockets: 1
          threads: 1
        devices:
          autoattachSerialConsole: true
          disks:
          - bootOrder: 1
            disk:
              bus: virtio
            name: rootdisk
          - name: installation-cdrom
            cdrom:
              bus: sata
              readonly: true
          - disk:
              bus: virtio
            name: cloudinitdisk
          interfaces:
          - name: default
            bridge: {}
          - name: private
            bridge: {}
          rng: {}
        features:
          smm:
            enabled: false
        firmware:
          bootloader:
            efi:
              secureBoot: false
        resources:
          requests:
            memory: {{ $sizing.memoryGb }}Gi
            cpu: "{{ $sizing.cpuCores }}"
          limits:
            memory: {{ $sizing.memoryGb }}Gi
            cpu: "{{ $sizing.cpuCores }}"
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: instance
                operator: In
                values:
                - {{ .Release.Name }}
            topologyKey: kubernetes.io/hostname
      readinessProbe:
        httpGet:
          path: /healthz
          port: 8181
        initialDelaySeconds: {{ .Values.readiness.initialDelaySeconds }}
        periodSeconds: {{ .Values.readiness.periodSeconds }}
        failureThreshold: {{ .Values.readiness.failureThreshold }}
        successThreshold: {{ .Values.readiness.successThreshold }}
      evictionStrategy: LiveMigrateIfPossible
      networks:
      - name: default
        pod: {}
      - name: private
        multus:
          networkName: {{ .Release.Namespace }}/qradar-private-net
      volumes:
      - dataVolume:
          name: qradar-secondary-rootdisk
        name: rootdisk
      - dataVolume:
          name: qradar-secondary-installation-cdrom
        name: installation-cdrom
      - cloudInitNoCloud:
          secretRef:
            name: qradar-secondary-credentials
        name: cloudinitdisk
{{- end -}}
