apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: qradar-console
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "qradar-ha.labels" . | nindent 4 }}
spec:
  port:
    targetPort: https
  tls:
    insecureEdgeTerminationPolicy: Redirect
    termination: passthrough
  to:
    kind: Service
    name: qradar-console-svc
    weight: 100
  wildcardPolicy: None
