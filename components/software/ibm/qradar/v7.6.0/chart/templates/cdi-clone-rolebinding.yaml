# Per-instance RoleBinding to allow cloning from qradar-media namespace
# Covers both RHEL template and QRadar ISO
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: qradar-media-clone-auth-{{ .Release.Name }}
  namespace: {{ .Values.storage.mediaNamespace }}
  labels:
    {{- include "qradar-ha.labels" . | nindent 4 }}
    app.kubernetes.io/component: clone-authorization
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
subjects:
- kind: ServiceAccount
  name: default
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: qradar-datavolume-cloner
