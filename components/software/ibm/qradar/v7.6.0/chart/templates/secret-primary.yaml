apiVersion: v1
kind: Secret
metadata:
  name: qradar-primary-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "qradar-ha.labels" . | nindent 4 }}
    vm-role: primary
type: Opaque
stringData:
  admin-password: {{ .Values.qradar.adminPassword | quote }}
  root-password: {{ .Values.qradar.rootPassword | quote }}
  userdata: |
    #cloud-config
    manage_etc_hosts: false
    users:
      - name: qradar
        groups: wheel
        sudo: ALL=(ALL) NOPASSWD:ALL
        shell: /bin/bash
        lock_passwd: false
      - name: root
        lock_passwd: false

    chpasswd:
      expire: false
      users:
        - name: qradar
          password: {{ .Values.qradar.adminPassword }}
          type: text
        - name: root
          password: {{ .Values.qradar.rootPassword }}
          type: text

    ssh_pwauth: true
    disable_root: false
    timezone: UTC

    runcmd:
      - echo "QRadar VM initialized from QRadar-ready RHEL template" > /var/log/qradar-ocp-init.log
      - systemctl enable sshd
      - systemctl start sshd
      - touch /tmp/.showed_qradar_eula
      - touch /tmp/.accepted_qradar_eula
      - systemctl stop firewalld 2>/dev/null || true
      - systemctl disable firewalld 2>/dev/null || true
      - timedatectl set-ntp true 2>/dev/null || true
      - systemctl restart chronyd 2>/dev/null || true
      - chronyc makestep 2>/dev/null || true

      # ====================================================================
      # SERIAL CONSOLE CONFIGURATION
      # Enable serial console for virtctl console access
      # ====================================================================
      - echo "Configuring serial console..." >> /var/log/qradar-ocp-init.log
      - |
        if ! grep -q "console=ttyS0" /etc/default/grub; then
          sed -i 's/GRUB_CMDLINE_LINUX="/GRUB_CMDLINE_LINUX="console=tty0 console=ttyS0,115200n8 /' /etc/default/grub
          sed -i 's/^GRUB_TERMINAL=.*/GRUB_TERMINAL="serial console"/' /etc/default/grub || echo 'GRUB_TERMINAL="serial console"' >> /etc/default/grub
          grub2-mkconfig -o /boot/grub2/grub.cfg 2>&1 | tee -a /var/log/qradar-ocp-init.log
          echo "Serial console added to GRUB" >> /var/log/qradar-ocp-init.log
        fi
      - systemctl enable serial-getty@ttyS0.service
      - systemctl start serial-getty@ttyS0.service
      - echo "Serial console configured and enabled" >> /var/log/qradar-ocp-init.log

      # ====================================================================
      # NETWORK CONFIGURATION
      # HA:         dual-NIC — enp1s0 (DHCP/pod), enp2s0 (static HA private net)
      # Standalone: single-NIC — DHCP discovery at runtime
      # ====================================================================
      - /usr/local/bin/qradar-ocp-configure.sh
      # ====================================================================

      - mkdir -p /media/cdrom
      - [/bin/bash, -c, "ISO_DEVICE='/dev/sr0'; if [ -b \"$ISO_DEVICE\" ]; then echo \"$ISO_DEVICE /media/cdrom auto defaults,ro 0 0\" >> /etc/fstab; mount /media/cdrom; echo 'ISO mounted successfully' >> /var/log/qradar-ocp-init.log; else echo 'ERROR: ISO device not found' >> /var/log/qradar-ocp-init.log; exit 1; fi"]

      {{- if eq .Values.topology "ha" }}
      # RUN prepare_ha.sh FROM ISO — required before installer on every HA VM
      # Sets up /store LVM partitioning and HA filesystem paths for QRadar installer.
      - [/bin/bash, -c, "LOG=/var/log/qradar-ocp-init.log; PREPARE=/media/cdrom/post/prepare_ha.sh; if [ -x \"$PREPARE\" ]; then echo '[OK] Running prepare_ha.sh...' >> $LOG; bash \"$PREPARE\" >> $LOG 2>&1; RC=$?; echo \"[OK] prepare_ha.sh exited with rc=$RC\" >> $LOG; else echo '[WARN] prepare_ha.sh not found at $PREPARE — skipping' >> $LOG; fi"]
      {{- end }}

      - echo "QRadar-ready RHEL base configured. Enabling post-reboot installer service..." >> /var/log/qradar-ocp-init.log
      # Patch AUTO_INSTALL_INSTRUCTIONS with the real current date/time so QRadar
      # installer does not receive a stale date baked in at template-render time.
      - [/bin/bash, -c, "sed -i \"s|^ai_time_current_date=.*|ai_time_current_date=$(date +%Y/%m/%d)|\" /root/AUTO_INSTALL_INSTRUCTIONS && sed -i \"s|^ai_time_current_time=.*|ai_time_current_time=$(date +%H:%M:%S)|\" /root/AUTO_INSTALL_INSTRUCTIONS && echo \"[OK] AUTO_INSTALL_INSTRUCTIONS date/time patched to $(date '+%Y/%m/%d %H:%M:%S')\" >> /var/log/qradar-ocp-init.log"]
      - mkdir -p /etc/systemd/system.conf.d
      - systemctl daemon-reexec
      - echo "Systemd status messages suppressed for current session" >> /var/log/qradar-ocp-init.log
      - |
        if ! grep -q "systemd.show_status=0" /etc/default/grub; then
          sed -i 's/GRUB_CMDLINE_LINUX="/GRUB_CMDLINE_LINUX="systemd.show_status=0 /' /etc/default/grub
          grub2-mkconfig -o /boot/grub2/grub.cfg 2>&1 | tee -a /var/log/qradar-ocp-init.log
          echo "Systemd status messages will be suppressed after reboot" >> /var/log/qradar-ocp-init.log
        fi
      - systemctl daemon-reload
      - systemctl enable NetworkManager
      {{- if eq .Values.topology "ha" }}
      - systemctl enable qradar-ocp-pretrust.service
      - systemctl enable qradar-ocp-network.service
      - systemctl enable qradar-ocp-ha-setup.service
      {{- end }}
      - systemctl enable qradar-ocp-healthz.service
      - systemctl enable qradar-ocp-installer.service
      {{- if eq .Values.topology "ha" }}
      - systemctl start qradar-ocp-network.service || true
      - systemctl start --no-block qradar-ocp-pretrust.service
      {{- end }}
      - systemctl start --no-block qradar-ocp-healthz.service
      - echo "Rebooting to start QRadar installation. Installation will continue automatically after reboot." >> /var/log/qradar-ocp-init.log
      - shutdown -r +1 "Rebooting to start QRadar installation"

    write_files:
      {{- if eq .Values.topology "ha" }}
      - path: /etc/management_interface
        permissions: '0644'
        owner: root:root
        content: |
          enp2s0

      - path: /usr/local/bin/qradar-ocp-configure.sh
        permissions: '0755'
        owner: root:root
        content: |
{{ include "qradar-ha.configureSh.primary" . | indent 10 }}

      - path: /usr/local/bin/qradar-ocp-network.sh
        permissions: '0755'
        owner: root:root
        content: |
{{ include "qradar-ha.networkSh.primary" . | indent 10 }}

      - path: /etc/systemd/system/qradar-ocp-network.service
        permissions: '0644'
        owner: root:root
        content: |
{{ include "qradar-ha.networkService" . | indent 10 }}

      - path: /usr/local/bin/qradar-ocp-pretrust.sh
        permissions: '0755'
        owner: root:root
        content: |
{{ include "qradar-ha.pretrustSh" . | indent 10 }}

      - path: /etc/systemd/system/qradar-ocp-pretrust.service
        permissions: '0644'
        owner: root:root
        content: |
{{ include "qradar-ha.pretrustService" . | indent 10 }}

      - path: /usr/local/bin/qradar-ocp-ha-setup.sh
        permissions: '0755'
        owner: root:root
        content: |
{{ include "qradar-ha.haSetupSh" . | indent 10 }}

      - path: /etc/systemd/system/qradar-ocp-ha-setup.service
        permissions: '0644'
        owner: root:root
        content: |
{{ include "qradar-ha.haSetupService" . | indent 10 }}
      {{- else }}
      - path: /usr/local/bin/qradar-ocp-configure.sh
        permissions: '0755'
        owner: root:root
        content: |
{{ include "qradar-ha.configureSh.standalone" . | indent 10 }}
      {{- end }}

      - path: /etc/systemd/system.conf.d/no-status-messages.conf
        permissions: '0644'
        owner: root:root
        content: |
{{ include "qradar-ha.noStatusMessages" . | indent 10 }}

      - path: /usr/local/bin/qradar-ocp-install.sh
        permissions: '0755'
        owner: root:root
        content: |
{{ include "qradar-ha.installSh" . | indent 10 }}

      - path: /etc/systemd/system/qradar-ocp-installer.service
        permissions: '0644'
        owner: root:root
        content: |
{{ include "qradar-ha.installerService" . | indent 10 }}

      - path: /root/AUTO_INSTALL_INSTRUCTIONS
        permissions: '0600'
        owner: root:root
        content: |
          # 1.0.0
          ai_admin_password={{ .Values.qradar.adminPassword }}
          ai_api_auth_token=
          ai_appliance_filter=na
          ai_appliance_number=3199
          ai_appliance_oem=qradar
          ai_bonding_enabled=false
          ai_bonding_interface_name=
          ai_bonding_interfaces=
          ai_bonding_options=miimon=100 mode=4 lacp_rate=1
          ai_console_host=
          ai_email_server=localhost
          ai_force=true
          {{- if eq .Values.topology "ha" }}
          ai_ha_cluster_virtual_ip=10.0.0.1
          ai_hostname=console.qradar.lab
          {{- else }}
          ai_ha_cluster_virtual_ip=
          ai_hostname=placeholder.qradar.lab
          {{- end }}
          ai_http_proxy_host=
          ai_http_proxy_password=
          ai_http_proxy_port=
          ai_http_proxy_user=
          ai_internet_access_mode=direct
          ai_ip_dns_primary={{ .Values.qradar.dnsPrimary }}
          ai_ip_dns_secondary={{ .Values.qradar.dnsSecondary | default "8.8.4.4" }}
          {{- if eq .Values.topology "ha" }}
          ai_ip_management_interface=enp2s0
          ai_ip_protocol=ipv4
          ai_ip_v4_address={{ .Values.network.primaryIp }}
          ai_ip_v4_address_public=
          ai_ip_v4_gateway=
          ai_ip_v4_network_mask=255.255.255.0
          {{- else }}
          ai_ip_management_interface=eth0
          ai_ip_protocol=ipv4
          ai_ip_v4_address=192.168.1.100
          ai_ip_v4_address_public=
          ai_ip_v4_gateway=192.168.1.1
          ai_ip_v4_network_mask=255.255.255.0
          {{- end }}
          ai_ip_v6_address=
          ai_ip_v6_address_public=
          ai_ip_v6_autoconf=false
          ai_ip_v6_gateway=
          ai_is_console=true
          ai_is_console_standby=false
          ai_root_password={{ .Values.qradar.rootPassword }}
          ai_security_template={{ .Values.qradar.securityTemplate }}
          ai_time_current_date=1970/01/01
          ai_time_current_time=00:00:00
          ai_time_ntp_server=
          ai_timezone={{ .Values.qradar.timezone }}
          ai_type_of_setup=normal

      - path: /usr/local/bin/qradar-ocp-healthz.py
        permissions: '0755'
        owner: root:root
        content: |
{{ include "qradar-ha.healthzPy" . | indent 10 }}

      - path: /usr/local/etc/qradar-ocp-healthz.iptables
        permissions: '0644'
        owner: root:root
        content: |
{{ include "qradar-ha.healthzIptables" . | indent 10 }}

      - path: /etc/systemd/system/qradar-ocp-healthz.service
        permissions: '0644'
        owner: root:root
        content: |
{{ include "qradar-ha.healthzService" . | indent 10 }}

      - path: /etc/motd
        permissions: '0644'
        owner: root:root
        content: |
          ================================================
          {{- if eq .Values.topology "ha" }}
          IBM QRadar SIEM - HA Primary Console
          Hostname : console.qradar.lab
          HA Fixed : {{ .Values.network.primaryIp }}
          HA VIP   : {{ .Values.network.virtualIp }}
          {{- else }}
          IBM QRadar SIEM - Standalone Console
          Hostname : {{ if .Values.standalone.hostname }}{{ .Values.standalone.hostname }}{{ else }}{{ .Release.Name }}.{{ .Values.network.domainName }}{{ end }}
          Network  : DHCP (auto-assigned)
          {{- end }}
          Version  : 7.6.0
          Instance : {{ .Release.Name }}
          ================================================

    final_message: "QRadar Console is ready after $UPTIME seconds"
