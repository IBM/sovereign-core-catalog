apiVersion: v1
kind: Service
metadata:
  name: qradar-console-svc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "qradar-ha.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: qradar
  ports:
    - name: https
      port: 443
      protocol: TCP
      targetPort: 443
    - name: healthz
      port: 8181
      protocol: TCP
      targetPort: 8181
