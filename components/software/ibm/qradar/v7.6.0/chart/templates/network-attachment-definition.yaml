{{- if eq .Values.topology "ha" -}}
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: qradar-private-net
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "qradar-ha.labels" . | nindent 4 }}
    app.kubernetes.io/component: network
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "qradar-private-net-{{ .Release.Name }}",
      "type": "ovn-k8s-cni-overlay",
      "topology": "layer2",
      "netAttachDefName": "{{ .Release.Namespace }}/qradar-private-net"
    }
{{- end -}}
